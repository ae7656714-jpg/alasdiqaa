<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e3d1f"><title>تفاصيل المنتج | الأصدقاء للتجارة والتوريدات</title>
<link rel="icon" href="icon.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0e3d1f;--leaf:#0b7a22;--yellow:#ffc107;--bg:#f8fbf6;--fg:#17251b;--muted:#617064;--line:#dce8d5;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7}
header{background:#fff;border-bottom:4px solid var(--yellow);position:sticky;top:0;z-index:5}.bar{max-width:1100px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;color:var(--green);text-decoration:none;font-weight:800;margin-inline-end:auto}.brand img{height:46px;width:auto}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:10px 17px;background:var(--leaf);color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.wa{background:#25d366;color:#083d1b}
.wrap{max-width:1100px;margin:auto;padding:26px 18px 48px}.back{color:var(--leaf);text-decoration:none;font-weight:800}.layout{display:grid;grid-template-columns:minmax(280px,.95fr) minmax(320px,1.05fr);gap:34px;align-items:start;margin-top:20px}
.visual{min-height:400px;border:1px solid var(--line);border-radius:24px;background:radial-gradient(ellipse at 50% 76%,rgba(11,122,34,.11),transparent 52%),linear-gradient(160deg,#fff,#f5faf1);display:grid;place-items:center;position:sticky;top:88px;overflow:hidden;padding:22px}
.visual:after{content:"";position:absolute;bottom:48px;width:55%;height:22px;border-radius:50%;background:rgba(15,45,20,.13);filter:blur(14px);animation:shadowPulse 4s ease-in-out infinite}
.visual img{position:relative;z-index:1;display:block;width:100%;height:355px;object-fit:contain;object-position:center;mix-blend-mode:normal;filter:none;animation:none}
.visual .noimg{font-size:6rem;z-index:1}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes shadowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(.82);opacity:.35}}
.kicker{display:inline-block;color:var(--leaf);font-weight:800;background:#e9f5e4;border-radius:99px;padding:4px 12px;font-size:.86rem}h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.3;color:var(--green);margin:12px 0}.sub{color:var(--muted);margin:0 0 20px}.price{font-size:1.9rem;color:var(--leaf);font-weight:800}.price small{font-size:.9rem;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;margin:18px 0}.panel h2{font-size:1.15rem;color:var(--green);margin:0 0 8px}.composition{white-space:pre-line}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.fact{background:#f3f8ef;border-radius:12px;padding:12px}.fact small{display:block;color:var(--muted)}.fact b{display:block;color:var(--green)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{color:var(--muted);font-size:.84rem;margin-top:16px}footer{text-align:center;background:var(--green);color:#fff;padding:20px}
.error{padding:40px 10px;text-align:center}
@media(max-width:760px){.layout{grid-template-columns:1fr;gap:16px}.visual{position:relative;top:auto;min-height:300px;max-height:360px}.visual img{height:300px}.bar{padding:8px 12px}.brand img{height:40px}.wrap{padding:18px 13px 34px}.actions .btn{flex:1}.facts{gap:8px}}
@media(prefers-reduced-motion:reduce){.visual img,.visual:after{animation:none}}
/* Original bottle artwork stays unfiltered and sharp; floating shadow is separate. */
</style></head><body>
<header><div class="bar"><a class="brand" href="index.html"><img src="logo-icon.jpg" alt=""><span>الأصدقاء للتجارة والتوريدات</span></a><a class="btn secondary" href="index.html#products" id="backTop">العودة للمنتجات</a></div></header>
<main class="wrap" id="content"><p>جارٍ تحميل بيانات المنتج…</p></main>
<footer>الأصدقاء للتجارة والتوريدات · <a href="https://wa.me/201127553859" style="color:#baf4c9">واتساب 01127553859</a></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=Number(new URLSearchParams(location.search).get('id'));
const lang=(()=>{try{return localStorage.getItem('lang')==='"en"'?'en':(JSON.parse(localStorage.getItem('lang')||'null')==='en'?'en':'ar')}catch(e){return 'ar'}})();
const names=[
['مكافحة الحشرات العامة','General Insect Control'],['مكافحة الثاقب والماص والتوتا أبسلوتا','Borers, Sucking Pests & Tuta absoluta'],['مكافحة العناكب والأكاروسات','Spider Mites & Acarids Control'],['مكافحة النيماتودا','Nematode Control'],['مكافحة الأمراض الفطرية','Fungal Disease Control'],['المخصبات','Fertilizers & Nutrients'],['الحشائش','Weed Control']];
const money=n=>Number(n).toLocaleString('en-US'),wa='https://wa.me/201127553859';
const categoryGuides={
ar:[
'يندرج هذا المنتج ضمن منتجات مكافحة الحشرات العامة. راجع ملصق العبوة لتحديد الآفات والمحاصيل المسجلة لهذا المنتج تحديدًا قبل الاستخدام.',
'يندرج هذا المنتج ضمن منتجات مكافحة بعض الآفات الثاقبة والماصة والتوتا أبسلوتا. تختلف الآفات والمحاصيل المسجلة باختلاف المنتج، لذلك يُرجى مراجعة الملصق المعتمد.',
'يندرج هذا المنتج ضمن قسم مكافحة العناكب والأكاروسات. لا تعتمد على اسم القسم وحده لتحديد الآفة المستهدفة؛ اتبع بيانات التسجيل وملصق العبوة.',
'يندرج هذا المنتج ضمن قسم منتجات مكافحة النيماتودا. يجب مراجعة ملصق المنتج للتأكد من المحاصيل والاستخدامات المسجلة وطريقة التطبيق المعتمدة.',
'يندرج هذا المنتج ضمن قسم مكافحة الأمراض الفطرية. حدّد المرض والمحصول من الملصق المعتمد، والتزم بتعليمات الاستخدام والاحتياطات المدونة على العبوة.',
'يندرج هذا المنتج ضمن قسم المخصبات والعناصر الغذائية. راجع التركيب المسجل وملصق العبوة لتحديد ملاءمته لاحتياجات المحصول وطريقة الاستخدام الموصى بها.',
'يندرج هذا المنتج ضمن قسم مكافحة الحشائش. تختلف الحشائش والمحاصيل المسجلة من منتج لآخر؛ لا تستخدمه إلا وفق الملصق والتعليمات المعتمدة.'
],
en:[
'This item is listed under general insect-control products. Check its own label for the registered target pests and crops before use.',
'This item is listed under products for certain borers, sucking pests and Tuta absoluta. Registered targets and crops vary by product; consult its approved label.',
'This item is listed under spider-mite and acarid control. Do not infer the target pest from the category alone; follow the product registration and label.',
'This item is listed under nematode-control products. Check the label for registered crops, uses and approved application instructions.',
'This item is listed under fungal-disease control. Confirm the disease and crop on the approved label and follow all use and safety directions.',
'This item is listed under fertilizers and nutrients. Review the recorded composition and product label to assess suitability and recommended use.',
'This item is listed under weed-control products. Registered weeds and crops differ by product; use only according to the approved label.'
]};
const makeDescription=(p,category,en)=>{
const guide=(categoryGuides[en?'en':'ar'][p.c]||[]).toString();
const composition=p.a?(en?'The catalogue lists this composition: ':'التركيب المسجل في الكتالوج لهذا المنتج: ')+p.a+'.':'';
const lead=en?('This page is dedicated to '+p.n+'. It shows the current catalogue price and pack information for this exact item.'):('هذه الصفحة مخصصة لمنتج '+p.n+' تحديدًا، وتعرض السعر وبيانات العبوة المسجلة لهذا الصنف.');
return [lead,composition,guide].filter(Boolean).join(' ');
};
async function init(){try{
const res=await fetch('index.html',{cache:'no-store'});if(!res.ok)throw 0;const source=await res.text();const match=source.match(/const DATA=(\[[\s\S]*?\]);\s*const CFG=/);if(!match)throw 0;
const products=JSON.parse(match[1]);const p=products.find(x=>x.id===id);if(!p)throw 0;
const en=lang==='en',title=en&&p.ne?p.ne:p.n,category=names[p.c]?.[en?1:0]||'';
document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';document.title=title+' | '+(en?'Al Asdiqaa':'الأصدقاء');
$('#backTop').textContent=en?'Back to products':'العودة للمنتجات';
const composition=p.a|| (en?'No active ingredients are listed for this item.':'لا توجد مواد فعالة مسجلة لهذا المنتج في الكتالوج.');
const intro=makeDescription(p,category,en);
$('#content').innerHTML='<a class="back" href="index.html#products">← '+(en?'All products':'كل المنتجات')+'</a><div class="layout"><div class="visual">'+(p.im?'<img src="'+esc(p.im)+'" alt="'+esc(title)+'">':'<div class="noimg" aria-hidden="true">🌱</div>')+'</div><section><span class="kicker">'+esc(category)+'</span><h1>'+esc(title)+'</h1><p class="sub">'+intro+'</p><div class="price">'+money(p.p)+' <small>'+(en?'EGP':'ج.م')+'</small></div><div class="facts"><div class="fact"><small>'+(en?'Category':'القسم')+'</small><b>'+esc(category)+'</b></div><div class="fact"><small>'+(en?'Units per carton':'عدد العبوات في الكرتونة')+'</small><b>'+(p.k||'—')+'</b></div></div><div class="panel"><h2>'+(en?'Active ingredients / composition':'المواد الفعالة والتركيب')+'</h2><div class="composition">'+esc(composition)+'</div></div><div class="panel"><h2>'+(en?'How to use product information':'شرح المنتج ومعلومات الاستخدام')+'</h2><p style="margin:0">'+(en?'This description is based on the item name, category and composition recorded in the catalogue. It does not replace the official leaflet. Always verify the registered crop, target, application rate, timing, compatibility and safety precautions on the original label before use.':'هذا الشرح مبني على اسم المنتج والقسم والتركيب المسجل في كتالوج الموقع، ولا يُعد بديلًا عن النشرة الرسمية. قبل الاستخدام، تحقّق من المحصول والآفة أو الغرض المسجل ومعدل الاستخدام والتوقيت والتوافق والاحتياطات من ملصق العبوة الأصلي.')+'</p></div><div class="actions"><button class="btn" id="add">'+(en?'Add to cart':'أضف للسلة')+'</button><a class="btn wa" id="ask" target="_blank" rel="noopener" href="'+wa+'?text='+encodeURIComponent((en?'Hello, I would like to ask about: ':'مرحبًا، أريد الاستفسار عن المنتج: ')+title)+'">'+(en?'Ask on WhatsApp':'استفسر عبر واتساب')+'</a></div><p class="notice">'+(en?'Prices may change; confirm availability and price on WhatsApp.':'قد تتغير الأسعار؛ يُرجى تأكيد السعر والتوافر عبر واتساب.')+'</p></section></div>';
$('#add').onclick=()=>{let cart={};try{cart=JSON.parse(localStorage.getItem('cart')||'{}')||{}}catch(e){}cart[p.id]=(Number(cart[p.id])||0)+1;try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}location.href='index.html#products'};
}catch(e){$('#content').innerHTML='<div class="error"><h1>لم يتم العثور على المنتج</h1><p>ارجع إلى قائمة المنتجات واختر المنتج مرة أخرى.</p><a class="btn" href="index.html#products">العودة للمنتجات</a></div>'}}
init();
</script></body></html>
