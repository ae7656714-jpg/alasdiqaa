*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7}
header{background:#fff;border-bottom:4px solid var(--yellow);position:sticky;top:0;z-index:5}.bar{max-width:1100px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;color:var(--green);text-decoration:none;font-weight:800;margin-inline-end:auto}.brand img{height:46px;width:auto}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:10px 17px;background:var(--leaf);color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.wa{background:#25d366;color:#083d1b}
.wrap{max-width:1100px;margin:auto;padding:26px 18px 48px}.back{color:var(--leaf);text-decoration:none;font-weight:800}.layout{display:grid;grid-template-columns:minmax(280px,.95fr) minmax(320px,1.05fr);gap:34px;align-items:start;margin-top:20px}
.visual{min-height:400px;border:1px solid var(--line);border-radius:24px;background:radial-gradient(ellipse at 50% 76%,rgba(11,122,34,.11),transparent 52%),linear-gradient(160deg,#fff,#f5faf1);display:grid;place-items:center;position:sticky;top:88px;overflow:hidden;padding:22px}
.visual:after{content:"";position:absolute;bottom:48px;width:55%;height:22px;border-radius:50%;background:rgba(15,45,20,.13);filter:blur(14px);animation:shadowPulse 4s ease-in-out infinite}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes shadowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(.82);opacity:.35}}

72:{lead:'ديكتاتور 30 – مبيد أكاروسي',use:'يذكر الملصق مكافحة الأكاروسات بما فيها العنكبوت الأحمر بمراحله المختلفة وبيض الشتاء، والأكاروسات الدقيقة وصانعات الأنفاق وحفار الساق.',effect:'تركيبة كلوروفينابير وبايريدابين. المعدل المطبوع على الملصق 100 سم³ لكل 200 لتر ماء؛ اتبع ملصق العبوة للمحصول وفترة الأمان.',ingredients:'كلوروفينابير 18% + بايريدابين 12%.'},
73:{lead:'ديكتاتور 30 – مبيد أكاروسي',use:'يذكر الملصق مكافحة الأكاروسات بما فيها العنكبوت الأحمر بمراحله المختلفة وبيض الشتاء، والأكاروسات الدقيقة وصانعات الأنفاق وحفار الساق.',effect:'تركيبة كلوروفينابير وبايريدابين. المعدل المطبوع على الملصق 100 سم³ لكل 200 لتر ماء؛ اتبع ملصق العبوة للمحصول وفترة الأمان.',ingredients:'كلوروفينابير 18% + بايريدابين 12%.'},

64:{lead:'راكــت 5.7% – مبيد حشري حيوي',use:'يذكر الملصق مكافحة التوتا أبسليوتا وسوسة الطماطم، وديدان الثمار، وعث العنكبوت، واليرقات، وديدان الفاكهة وحفار التربة. كما يذكر استخدامه ضمن برامج المكافحة المتكاملة IPM.',effect:'تأثير على البيض وحديث الفقس. معدلات الاستخدام المطبوعة تشمل دودة ثمار الخضروات 80 جرامًا/فدان، ودودة لوز القطن ودودة ثمار الموالح 60 جرامًا/فدان. فترة الأمان المذكورة: الخضروات 3–7 أيام، الأشجار المثمرة 14 يومًا، الحبوب 21 يومًا.',ingredients:'إيمامكتين بنزوات 5.7%.'},

132:{lead:'مبيد حشائش في صورة مركز قابل للذوبان في الماء',use:'مكافحة الحشائش الكلية الحولية والمعمرة؛ ويُرجع للتعليمات المدونة على العبوة لتحديد الاستخدام المعتمد.',effect:'ينتقل إلى المجموع الخضري ثم الريزومات وفق النص الظاهر على الملصق.',ingredients:'جليفوسات أيزوبروبيل أمونيوم 48%، ومواد بيولوجية منشطة 17%.'},
86:{lead:'نيوماك – مبيد أكاروسي/حشري',use:'يذكر الملصق الاستخدام على المزروعات لمكافحة العنكبوت الأحمر العادي وذي النقطتين، وأكاروس صدأ الموالح، والأحمر الأوروبي، وصانعات الأنفاق.',effect:'يؤثر بالملامسة أو عن طريق التغذية. الملصق يعرض تركيزين للآبامكتين.',ingredients:'آبامكتين 3.6%، ويتوفر أيضًا بتركيز 1.8% حسب الملصق.'},
78:{lead:'ميكس كيلر – مبيد أكاروسي شديد الفاعلية وطويل المفعول',use:'يذكر الملصق مكافحة جميع أنواع الأكاروسات والعناكب في جميع أطوارها، بما فيها اليرقات والحوريات والأطوار المتحركة، كما يسرد آفات أخرى مثل حلم النخيل، البيض الشتوي، حلم العنب، حفارات الساق، توتا أبسليوتا، دودة ورق القطن، صانعات الأنفاق، دودة الذرة الأوروبية، فراشة درنات البطاطس، الخنفساء، الفراشة، السوسة، ذبابة البنجر، واليرقات.',effect:'تركيبة ثلاثية شديدة الفاعلية وممتدة، تعمل بالملامسة والمعدة وتساعد على الحد من ظهور المقاومة. معدل الاستخدام المطبوع: 40 سم³ لكل 100 لتر ماء. فترة ما قبل الحصاد: الخضروات 3 أيام، الفاكهة والعنب 14 يومًا.',ingredients:'فينيبروكسيمات 5% + هيكسيثيازوكس 5% + سيفلوميتوفين 5%.'},

38:{lead:'لمبادا ستاك 10% EC',use:'مبيد حشري بالملامسة والهضم. راجع الآفات والمحاصيل المسجلة على العبوة قبل التطبيق.',effect:'واسع المجال قوي المفعول. فترة ما قبل الحصاد المكتوبة: النخيل والذرة الشامية 15 يومًا، والخضروات 7 أيام.',ingredients:'لمبادا سيهالوثرين 10%، ويوفر الملصق أيضًا تركيز 5%.'},

function labelPanel(p,en){
 const d=labelInfo[p.id];
 const title=en?'Product label details':'تفاصيل الملصق الخاص بالمنتج';
 if(!d) return '<div class="panel"><h2>'+title+'</h2><p><b>'+(en?'Product-specific registered composition':'التركيب المسجل لهذا المنتج')+':</b></p><div class="composition">'+esc(p.a||(en?'No composition recorded in the catalog.':'لا يوجد تركيب مسجل لهذا المنتج في الكتالوج.'))+'</div><p class="notice">'+(en?'A full transcription of this exact product poster is not available yet. No crop, pest, dose or duration has been invented. Confirm those instructions from the physical package label before use.':'لم تتوفر بعد قراءة كاملة موثقة لصورة ملصق هذا المنتج تحديدًا. لم أختلق محصولًا أو آفة أو جرعة أو مدة تأثير. يُرجى مراجعة الملصق الأصلي على العبوة قبل الاستخدام.')+'</p></div>';
 return '<div class="panel"><h2>'+title+'</h2>'+(d.lead?'<p><b>'+esc(d.lead)+'</b></p>':'')+'<p><b>'+(en?'Use':'الاستخدام')+':</b> '+esc(d.use)+'</p><p><b>'+(en?'Effect':'المفعول')+':</b> '+esc(d.effect)+'</p><p><b>'+(en?'Ingredients stated on the label':'المواد المذكورة على الملصق')+':</b> '+esc(d.ingredients)+'</p><p class="notice">'+(en?'Only the details recorded above have been transcribed; verify dosage and application intervals from the package label.':'المعلومات أعلاه هي المسجلة فقط؛ راجع العبوة لتأكيد الجرعة وفترات الاستخدام.')+'</p></div>';
}

async function init(){try{
const res=await fetch('index.html',{cache:'no-store'});if(!res.ok)throw 0;const source=await res.text();const match=source.match(/const DATA=(\[[\s\S]*?\]);\s*const CFG=/);if(!match)throw 0;
const products=JSON.parse(match[1]);const p=products.find(x=>x.id===id);if(!p)throw 0;
const en=lang==='en',title=en&&p.ne?p.ne:p.n,category=names[p.c]?.[en?1:0]||'';
document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';document.title=title+' | '+(en?'Al Asdiqaa':'الأصدقاء');
$('#backTop').textContent=en?'Back to products':'العودة للمنتجات';
const composition=p.a|| (en?'No active ingredients are listed for this item.':'لا توجد مواد فعالة مسجلة لهذا المنتج في الكتالوج.');

$('#content').innerHTML='<a class="back" href="index.html#products">← '+(en?'All products':'كل المنتجات')+'</a><div class="layout"><div class="visual">'+(p.im?'<img src="'+esc(p.im)+'" alt="'+esc(title)+'">':'<div class="noimg" aria-hidden="true">🌱</div>')+'</div><section><span class="kicker">'+esc(category)+'</span><h1>'+esc(title)+'</h1><div class="price">'+money(p.p)+' <small>'+(en?'EGP':'ج.م')+'</small></div><div class="facts"><div class="fact"><small>'+(en?'Category':'القسم')+'</small><b>'+esc(category)+'</b></div><div class="fact"><small>'+(en?'Units per carton':'عدد العبوات في الكرتونة')+'</small><b>'+(p.k||'—')+'</b></div></div><div class="panel"><h2>'+(en?'Active ingredients / composition':'المواد الفعالة والتركيب')+'</h2><div class="composition">'+esc(composition)+'</div></div>'+labelPanel(p,en)+'<div class="actions"><button class="btn" id="add">'+(en?'Add to cart':'أضف للسلة')+'</button><a class="btn wa" id="ask" target="_blank" rel="noopener" href="'+wa+'?text='+encodeURIComponent((en?'Hello, I would like to ask about: ':'مرحبًا، أريد الاستفسار عن المنتج: ')+title)+'">'+(en?'Ask on WhatsApp':'استفسر عبر واتساب')+'</a></div><p class="notice">'+(en?'Prices may change; confirm availability and price on WhatsApp.':'قد تتغير الأسعار؛ يُرجى تأكيد السعر والتوافر عبر واتساب.')+'</p></section></div>';
$('#add').onclick=()=>{let cart={};try{cart=JSON.parse(localStorage.getItem('cart')||'{}')||{}}catch(e){}cart[p.id]=(Number(cart[p.id])||0)+1;try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}location.href='index.html#products'};
}catch(e){$('#content').innerHTML='<div class="error"><h1>لم يتم العثور على المنتج</h1><p>ارجع إلى قائمة المنتجات واختر المنتج مرة أخرى.</p><a class="btn" href="index.html#products">العودة للمنتجات</a></div>'}}
init();
</script></body></html>
