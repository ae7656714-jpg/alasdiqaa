<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة موقع الأصدقاء</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#17231b;background:#f4f7f4}
*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:980px;margin:auto}
header,.panel{background:#fff;border:1px solid #e0e8e1;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 5px 22px #18351b0b}
h1{margin:0 0 8px;color:#17652d;font-size:25px}h2{font-size:19px;margin:0 0 16px}
.muted{color:#657269;font-size:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input,textarea{width:100%;padding:12px;border:1px solid #ccd8ce;border-radius:9px;font:inherit;margin:6px 0 14px;background:#fff}
textarea{min-height:110px;resize:vertical}label{font-weight:700;font-size:14px}
button{border:0;border-radius:9px;padding:11px 17px;font:inherit;cursor:pointer;background:#17652d;color:white}
button.secondary{background:#e8efe9;color:#23432b}button.danger{background:#a93232}
button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}
.notice{padding:12px;border-radius:9px;background:#eef6ef;margin:12px 0;color:#285b34;white-space:pre-wrap}
.item{border:1px solid #e0e8e1;border-radius:12px;padding:15px;margin:10px 0}
.item h3{margin:0 0 6px}.item p{white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:650px){body{padding:12px}.grid{grid-template-columns:1fr}header,.panel{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div><h1>لوحة إدارة موقع الأصدقاء</h1><div class="muted">إدارة محتوى الموقع التعريفي المسموح به. لا تُدخل بيانات بيع أو تعليمات استخدام مواد خطرة.</div></div>
<button id="logout" class="secondary hidden">تسجيل الخروج</button>
</header>
<section id="login" class="panel">
<h2>تسجيل دخول المدير</h2>
<form id="loginForm">
<label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required>
<label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">دخول</button>
</form><div id="loginMsg" class="notice hidden" role="status"></div>
</section>
<section id="app" class="hidden">
<div class="panel">
<h2 id="formTitle">إضافة محتوى جديد</h2>
<form id="contentForm">
<input id="recordId" type="hidden">
<div class="grid">
<div><label for="section">مفتاح القسم</label><input id="section" maxlength="80" placeholder="مثال: about أو contact" required></div>
<div><label for="title">العنوان</label><input id="title" maxlength="180" placeholder="عنوان المحتوى"></div>
</div>
<label for="body">النص</label><textarea id="body" placeholder="اكتب النص التعريفي هنا"></textarea>
<label for="image">رابط صورة (اختياري)</label><input id="image" type="url" placeholder="https://...">
<label class="row" style="font-weight:400"><input id="published" type="checkbox" style="width:auto;margin:0"> نشر هذا المحتوى للزوار</label>
<div class="actions"><button id="saveBtn" type="submit">حفظ المحتوى</button><button id="cancelBtn" type="button" class="secondary">إلغاء التعديل</button></div>
</form><div id="appMsg" class="notice hidden" role="status"></div>
</div>
<div class="panel"><div class="top"><h2>المحتوى المسجل</h2><button id="refresh" class="secondary">تحديث القائمة</button></div><div id="records" class="muted">جارٍ التحميل...</div></div>

<div class="panel" id="productsPanel">
 <div class="top"><h2>إدارة المنتجات</h2><span class="muted">إضافة وتعديل وحذف المنتجات داخل لوحة المدير فقط</span></div>
 <form id="productForm">
  <input id="productId" type="hidden">
  <div class="grid">
   <div><label for="productName">اسم المنتج</label><input id="productName" maxlength="180" required placeholder="اسم المنتج"></div>
   <div><label for="productCategory">التصنيف</label><input id="productCategory" maxlength="120" placeholder="التصنيف"></div>
  </div>
  <label for="productDescription">الوصف التعريفي</label>
  <textarea id="productDescription" placeholder="وصف تعريفي عام للمنتج، دون جرعات أو تعليمات استخدام"></textarea>
  <label for="productImage">رابط صورة المنتج (اختياري)</label><input id="productImage" type="url" placeholder="https://...">
  <label class="row" style="font-weight:400"><input id="productPublished" type="checkbox" style="width:auto;margin:0"> المنتج منشور</label>
  <div class="actions"><button id="productSaveBtn" type="submit">إضافة المنتج</button><button id="productCancelBtn" type="button" class="secondary">إلغاء</button></div>
 </form>
 <div id="productMsg" class="notice hidden" role="status"></div>
</div>
<div class="panel"><div class="top"><h2>قائمة المنتجات</h2><button id="productRefresh" class="secondary">تحديث القائمة</button></div><div id="productsList" class="muted">جارٍ التحميل...</div></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://aaozutwwkovfgexpwpxp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7QRsdtQgg5xXR5GblDOkpQ_qwhA1A8x';
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
function message(id,text){$(id).textContent=text;$(id).classList.remove('hidden')}
function clearMessage(id){$(id).textContent='';$(id).classList.add('hidden')}
function showApp(on){$('login').classList.toggle('hidden',on);$('app').classList.toggle('hidden',!on);$('logout').classList.toggle('hidden',!on)}
function resetForm(){$('contentForm').reset();$('recordId').value='';$('formTitle').textContent='إضافة محتوى جديد';$('saveBtn').textContent='حفظ المحتوى';}
async function verifyAdmin(){
 const {data:{user}}=await client.auth.getUser();
 if(!user){showApp(false);return false}
 const {data,error}=await client.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
 if(error||!data){await client.auth.signOut();showApp(false);message('loginMsg','هذا الحساب غير مسجل كمدير للموقع.');return false}
 showApp(true);await loadRecords();await loadProducts();return true;
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();clearMessage('loginMsg');$('loginBtn').disabled=true;
 const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 $('loginBtn').disabled=false;
 if(error){message('loginMsg','تعذر تسجيل الدخول: '+error.message);return}
 await verifyAdmin();
});
$('logout').addEventListener('click',async()=>{await client.auth.signOut();showApp(false);resetForm()});
async function loadRecords(){
 $('records').textContent='جارٍ التحميل...';
 const {data,error}=await client.from('site_content').select('*').order('created_at',{ascending:false});
 if(error){$('records').textContent='تعذر تحميل المحتوى: '+error.message;return}
 $('records').replaceChildren();
 if(!data.length){$('records').textContent='لا يوجد محتوى حتى الآن.';return}
 data.forEach(item=>{
  const card=document.createElement('article');card.className='item';
  const h=document.createElement('h3');h.textContent=item.title||item.section_key;
  const meta=document.createElement('div');meta.className='muted';meta.textContent='القسم: '+item.section_key+' — '+(item.is_published?'منشور':'مسودة');
  const p=document.createElement('p');p.textContent=item.body||'';
  card.append(h,meta,p);
  if(item.image_url){const link=document.createElement('a');link.href=item.image_url;link.target='_blank';link.rel='noopener';link.textContent='فتح الصورة';card.append(link)}
  const actions=document.createElement('div');actions.className='actions';
  const edit=document.createElement('button');edit.className='secondary';edit.textContent='تعديل';edit.onclick=()=>editRecord(item);
  const del=document.createElement('button');del.className='danger';del.textContent='حذف';del.onclick=()=>deleteRecord(item.id);
  actions.append(edit,del);card.append(actions);$('records').append(card);
 });
}
function editRecord(item){$('recordId').value=item.id;$('section').value=item.section_key;$('title').value=item.title||'';$('body').value=item.body||'';$('image').value=item.image_url||'';$('published').checked=!!item.is_published;$('formTitle').textContent='تعديل المحتوى';$('saveBtn').textContent='حفظ التعديلات';window.scrollTo({top:0,behavior:'smooth'})}
$('contentForm').addEventListener('submit',async e=>{
 e.preventDefault();clearMessage('appMsg');$('saveBtn').disabled=true;
 const payload={section_key:$('section').value.trim(),title:$('title').value.trim()||null,body:$('body').value.trim()||null,image_url:$('image').value.trim()||null,is_published:$('published').checked,updated_at:new Date().toISOString()};
 let result;
 if($('recordId').value) result=await client.from('site_content').update(payload).eq('id',Number($('recordId').value));
 else result=await client.from('site_content').insert(payload);
 $('saveBtn').disabled=false;
 if(result.error){message('appMsg','تعذر الحفظ: '+result.error.message);return}
 message('appMsg','تم حفظ المحتوى بنجاح.');resetForm();await loadRecords();
});
async function deleteRecord(id){if(!confirm('هل تريد حذف هذا المحتوى؟'))return;const {error}=await client.from('site_content').delete().eq('id',id);if(error){message('appMsg','تعذر الحذف: '+error.message);return}message('appMsg','تم حذف المحتوى.');await loadRecords()}
$('cancelBtn').addEventListener('click',resetForm);
$('refresh').addEventListener('click',loadRecords);

function resetProductForm(){
 $('productForm').reset();$('productId').value='';
 $('productSaveBtn').textContent='إضافة المنتج';
}
function productMessage(text){
 $('productMsg').textContent=text;$('productMsg').classList.remove('hidden');
}
async function loadProducts(){
 $('productsList').textContent='جارٍ التحميل...';
 const {data,error}=await client.from('products').select('*').order('created_at',{ascending:false});
 if(error){$('productsList').textContent='تعذر تحميل المنتجات: '+error.message;return}
 $('productsList').replaceChildren();
 if(!data.length){$('productsList').textContent='لا توجد منتجات مسجلة حتى الآن.';return}
 data.forEach(item=>{
  const card=document.createElement('article');card.className='item';
  const h=document.createElement('h3');h.textContent=item.name||'منتج بدون اسم';
  const meta=document.createElement('div');meta.className='muted';
  meta.textContent='التصنيف: '+(item.category||'غير محدد')+' — '+(item.is_published?'منشور':'غير منشور');
  card.append(h,meta);
  if(item.description){const p=document.createElement('p');p.textContent=item.description;card.append(p)}
  if(item.image_url){
   const a=document.createElement('a');a.href=item.image_url;a.target='_blank';a.rel='noopener';a.textContent='فتح صورة المنتج';card.append(a);
  }
  const actions=document.createElement('div');actions.className='actions';
  const edit=document.createElement('button');edit.className='secondary';edit.textContent='تعديل';
  edit.onclick=()=>editProduct(item);
  const del=document.createElement('button');del.className='danger';del.textContent='حذف';
  del.onclick=()=>deleteProduct(item.id);
  actions.append(edit,del);card.append(actions);$('productsList').append(card);
 });
}
function editProduct(item){
 $('productId').value=item.id;
 $('productName').value=item.name||'';
 $('productCategory').value=item.category||'';
 $('productDescription').value=item.description||'';
 $('productImage').value=item.image_url||'';
 $('productPublished').checked=!!item.is_published;
 $('productSaveBtn').textContent='حفظ التعديلات';
 $('productsPanel').scrollIntoView({behavior:'smooth',block:'start'});
}
$('productForm').addEventListener('submit',async e=>{
 e.preventDefault();$('productSaveBtn').disabled=true;
 const payload={
  name:$('productName').value.trim(),
  category:$('productCategory').value.trim()||null,
  description:$('productDescription').value.trim()||null,
  image_url:$('productImage').value.trim()||null,
  is_published:$('productPublished').checked,
  updated_at:new Date().toISOString()
 };
 let result;
 if($('productId').value) result=await client.from('products').update(payload).eq('id',Number($('productId').value));
 else result=await client.from('products').insert(payload);
 $('productSaveBtn').disabled=false;
 if(result.error){productMessage('تعذر حفظ المنتج: '+result.error.message);return}
 productMessage('تم حفظ المنتج بنجاح.');
 resetProductForm();await loadProducts();
});
async function deleteProduct(id){
 if(!confirm('هل تريد حذف هذا المنتج نهائيًا؟'))return;
 const {error}=await client.from('products').delete().eq('id',id);
 if(error){productMessage('تعذر حذف المنتج: '+error.message);return}
 productMessage('تم حذف المنتج.');await loadProducts();
}
$('productCancelBtn').addEventListener('click',resetProductForm);
$('productRefresh').addEventListener('click',loadProducts);

client.auth.onAuthStateChange((_event,session)=>{if(!session)showApp(false)});
verifyAdmin();
</script>
</body>
</html>
