const ids=Object.keys(cart),nm=$('#fn').value.trim(),ph=$('#fp').value.trim(),ad=$('#fa').value.trim(),nt=$('#fnote').value.trim();
const err=!ids.length?t('e_cart'):!nm?t('e_name'):!/^\+?[\d\s()-]{8,}$/.test(ph)?t('e_phone'):!ad?t('e_address'):'';
$('#err').textContent=err;if(err){drawer(true);return}let tot=0;
const L=ids.map((id,i)=>{const p=P.find(x=>x.id==id),q=cart[id];tot+=p.p*q;return (i+1)+'. '+p.n+' × '+q+' = '+fmt(p.p*q)+' '+cur()});
const msg=[t('wa'),' ',t('name')+': '+nm,t('phone')+': '+ph,t('address')+': '+ad,'',...L,'',t('total')+': '+fmt(tot)+' '+cur(),...(nt?['',t('note')+': '+nt]:[])].join('\n');
window.open(waUrl(msg),'_blank','noopener')
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.add)setQty(+d.add,1);else if(d.inc)setQty(+d.inc,(cart[d.inc]||0)+1);else if(d.dec)setQty(+d.dec,(cart[d.dec]||0)-1);else if(d.rm)setQty(+d.rm,0);
else if(d.cat!==undefined){cat=cat===+d.cat?-1:+d.cat;$('#sel').value=cat;renderCats();renderProducts();$('#products').scrollIntoView()}});
$('#lg').onclick=()=>setLang(lang==='ar'?'en':'ar');
$('#cb').onclick=()=>drawer(true);$('#cx').onclick=$('#ov').onclick=()=>drawer(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')drawer(false)});
$('#q').oninput=e=>{q=norm(e.target.value.trim());renderProducts()};
$('#sel').onchange=e=>{cat=+e.target.value;renderCats();renderProducts()};
$('#send').onclick=send;$('#cbSend').onclick=()=>drawer(true);$('#cbOpen').onclick=()=>drawer(true);
Promise.resolve(DATA).then(d=>{P=d;P.forEach(p=>{p.s=norm(p.n+' '+(p.ne||'')+' '+p.a);if(sc[p.id]>0)cart[p.id]=Math.floor(sc[p.id])});setLang(lang)}).catch(()=>{$('#grid').innerHTML='<p class="empty">⚠️</p>'});
setLang(lang);
</script><script>
(()=>{const c=document.createElement('canvas');c.id='particle-background';c.setAttribute('aria-hidden','true');Object.assign(c.style,{position:'fixed',inset:'0',width:'100%',height:'100%',zIndex:'0',pointerEvents:'none',opacity:'.72'});document.body.prepend(c);
const ctx=c.getContext('2d',{alpha:true});let w=0,h=0,dpr=1,points=[],mx=-1000,my=-1000,lastX=-1000,lastY=-1000,raf=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.min(240,Math.max(70,Math.round(w*h/8500)));points=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,ox:Math.random()*w,oy:Math.random()*h,vx:0,vy:0,r:.8+Math.random()*1.6,phase:Math.random()*6.28}))}
function darkMode(){return document.documentElement.classList.contains('dark')||document.body.classList.contains('dark')||document.documentElement.dataset.theme==='dark'||document.body.dataset.theme==='dark'||document.documentElement.getAttribute('data-bs-theme')==='dark'||(matchMedia('(prefers-color-scheme: dark)').matches&&!document.documentElement.classList.contains('light')&&!document.body.classList.contains('light'))}function pointer(e){mx=e.clientX;my=e.clientY}addEventListener('resize',resize,{passive:true});addEventListener('pointermove',pointer,{passive:true});addEventListener('touchmove',e=>{if(e.touches[0])pointer(e.touches[0])},{passive:true});resize();
function draw(){ctx.clearRect(0,0,w,h);const link= Math.min(135,Math.max(85,w*.12)),near=115;
for(const p of points){const dx=mx-p.x,dy=my-p.y,dist=Math.hypot(dx,dy)||1;if(dist<near){const force=(1-dist/near)*.19;p.vx+=(dx/dist)*force*4;p.vy+=(dy/dist)*force*4}
p.vx+=(p.ox-p.x)*.0015;p.vy+=(p.oy-p.y)*.0015;p.vx*=.94;p.vy*=.94;p.x+=p.vx;p.y+=p.vy;
if(p.x<-8)p.x=w+8;if(p.x>w+8)p.x=-8;if(p.y<-8)p.y=h+8;if(p.y>h+8)p.y=-8;
}
for(let i=0;i<points.length;i++){const a=points[i];for(let j=i+1;j<points.length;j++){const b=points[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);if(d<link){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=darkMode()?'rgba(255,255,255,'+((1-d/link)*.34)+')':'rgba(5,35,10,'+((1-d/link)*.48)+')';ctx.lineWidth=.7;ctx.stroke()}}}
for(const p of points){const d=Math.hypot(mx-p.x,my-p.y),glow=Math.max(0,1-d/near);ctx.beginPath();ctx.arc(p.x,p.y,p.r+glow*1.4,0,Math.PI*2);ctx.fillStyle=darkMode()?(glow?'rgba(255,255,255,'+(.92+glow*.08)+')':'rgba(255,255,255,.96)'):(glow?'rgba(3,28,8,'+(.92+glow*.08)+')':'rgba(5,42,12,1)');ctx.fill()}
if(!reduce)raf=requestAnimationFrame(draw)}
draw();})();
</script></body></html>
